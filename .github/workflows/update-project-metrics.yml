name: Update project metrics

on:
  pull_request:
    paths:
      - "scripts/update_project_metrics.py"
      - "tests/test_update_project_metrics.py"
      - ".github/workflows/update-project-metrics.yml"
      - "assets/project-metrics/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test metrics asset filters and guards
        run: python -m unittest discover -s tests -p 'test_*.py'

  update:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_project_metrics.py

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/project-metrics; then
            echo "Metrics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-metrics
          git commit -m "chore: update project metrics"
          git push
