<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150">
<style>
  .bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.muted{fill:#656d76}.link{fill:#0969da}
  .status{fill:#dafbe1}.statusText{fill:#116329}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.muted{fill:#8b949e}.link{fill:#58a6ff}
    .status{fill:#238636}.statusText{fill:#aff5b4}
  }
</style>
<rect class="bg" width="500" height="150"/>
<rect class="panel" x="1" y="1" width="498" height="148" rx="12" stroke-width="1.5"/>
<rect class="panel" x="18" y="18" width="48" height="48" rx="9"/>
<text class="link" x="42" y="48" text-anchor="middle" font-size="12" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">DNS</text>
<text class="link" x="82" y="39" font-size="17" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">DnsSwitcher</text>
<text class="muted" x="82" y="62" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Windows DNS</text>
<text class="muted" x="20" y="121" font-size="13.5" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">C# · .NET</text>
<rect class="status" x="402" y="98" width="78" height="32" rx="8"/>
<text class="statusText" x="441" y="119" text-anchor="middle" font-size="13" font-weight="650" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Stable</text>
</svg>